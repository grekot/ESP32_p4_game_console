; LakeMarioGame - mini konsola do gier na ESP32-P4
; Plytka: Guition JC4880P443C_I_W_Y (ESP32-P4 + ESP32-C6, 4.3" IPS 480x800 MIPI-DSI, dotyk GT911)
;
; Framework: ESP-IDF 5.5 przez platforme pioarduino (oficjalna platforma
; platformio/espressif32 nie wspiera ESP32-P4).
; Pierwszy build pobiera platforme + toolchain + ESP-IDF (~1.5 GB) - potrwa kilkanascie minut.

[platformio]
default_envs = jc4880p443c
; Zawartosc partycji assets (SPIFFS): obrazki PNG gier w assets/<id gry>/. Wgrywanie: pio run -t uploadfs
data_dir = assets
description = Console - mini konsola do gier na ESP32-P4 (Guition JC4880P443C)

[env:jc4880p443c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4
framework = espidf

; Flash 16 MB, wlasna tablica partycji (4 MB app + ~12 MB na assety)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; System plikow partycji assets: firmware montuje SPIFFS (esp_vfs_spiffs_register). Bez tej linii pioarduino buduje
; obraz LittleFS - `uploadfs` wgralby partycje nieczytelna dla firmware (a format_if_mount_failed by ja skasowal).
board_build.filesystem = spiffs
; Parametry obrazu musza byc zgodne z sdkconfig (CONFIG_SPIFFS_OBJ_NAME_LEN=64, META_LENGTH=4, PAGE_SIZE=256);
; generator pioarduino domyslnie bierze obj_name_len = 32 - obraz bylby nieczytelny dla firmware.
board_build.spiffs.obj_name_len = 64
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

build_flags =
    ; Orientacja ekranu w grze (panel jest natywnie pionowy 480x800, gra dziala poziomo 800x480).
    ; 90 lub 270 - zmien, jesli obraz jest do gory nogami wzgledem zlaczy USB.
    -DCONSOLE_DISPLAY_ROTATION=90
    ; Uwaga: sciezke do src/ui (lv_conf.h) dodaje CMakeLists.txt globalnie dla wszystkich
    ; komponentow - flagi stad nie docieraja do kompilacji LVGL.
    ; Odkomentuj, aby wyswietlac FPS w rogu ekranu
    ; -DCONSOLE_SHOW_FPS=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600

; Ustaw port COM, pod ktorym zglasza sie plytka (zlacze USB-C podpisane "USB"/JTAG
; = natywny USB-Serial/JTAG ESP32-P4). Bez tego PlatformIO sprobuje wykryc port sam.
; upload_port = COM28
; monitor_port = COM28
